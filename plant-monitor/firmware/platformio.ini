; ESP32 Multi-Plant Monitor
;
; Two build environments:
;   hwtest  - Phase 1 hardware bring-up: I2C scan + per-sensor serial tests.
;             Flash this FIRST to verify wiring. No Wi-Fi needed, no secrets.h needed.
;   station - Full monitoring firmware: calibrated readings, JSON payload,
;             Wi-Fi + NTP + HTTP upload. Requires include/secrets.h
;             (copy include/secrets.example.h and fill in your values).
;
; Usage:
;   pio run -e hwtest  -t upload   # Phase 1
;   pio run -e station -t upload   # Phases 2-4
;   pio device monitor             # serial monitor at 115200 baud

[platformio]
default_envs = hwtest

[env]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    claws/BH1750@^1.3.0
    adafruit/Adafruit BME280 Library@^2.2.4
    bblanchon/ArduinoJson@^7.2.0

[env:hwtest]
build_src_filter = +<*> -<main_station.cpp> -<net.cpp> -<payload.cpp>

[env:station]
build_src_filter = +<*> -<main_hwtest.cpp>
